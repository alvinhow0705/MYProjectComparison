<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:type" content="website">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EDVF9QYQPZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EDVF9QYQPZ');
      gtag('config', 'AW-18344712116');

    <script src="../assets/i18n.js?v=1"></script>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
    <link rel="apple-touch-icon" sizes="192x192" href="../favicon-192.png">
    <style>
        :root { --bg:#0b1020; --card:#131a2e; --line:rgba(255,255,255,.12); --txt:#eef1f8; --mut:#9aa5bd; --green:#25D366; --gold:#ffc65c; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html, body { background:var(--bg); }
        body { color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif; min-height:100vh; display:flex; justify-content:center; padding:36px 16px 48px; background:radial-gradient(circle at 50% -10%, #1b2750 0, var(--bg) 55%); }
        .wrap { width:100%; max-width:440px; text-align:center; }
        .avatar { width:112px; height:112px; border-radius:50%; margin:0 auto 16px; background:#1d2744; border:2px solid var(--line); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; color:var(--gold); }
        .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
        h1 { font-size:24px; font-weight:700; letter-spacing:.01em; }
        .line { text-wrap:balance; margin:10px auto 0; max-width:340px; font-size:15.5px; line-height:1.6; color:#d3d9e8; }
        .links { margin-top:28px; display:flex; flex-direction:column; gap:14px; }
        .btn { text-wrap:balance; display:block; text-decoration:none; color:var(--txt); background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-size:17px; font-weight:600; line-height:1.4; transition:transform .15s, border-color .15s; }
        .btn:hover, .btn:focus-visible { transform:translateY(-1px); border-color:rgba(255,255,255,.35); outline:none; }
        .btn.primary { background:linear-gradient(90deg,#2ee06f,#17b354); color:#04240f; border-color:transparent; }
        .btn.wa { border-color:rgba(37,211,102,.55); }
        .foot { margin-top:34px; font-size:12px; color:#6f7a93; }
        .foot a { color:#8b95ab; }
    </style>
</head>
<body>
<main class="wrap">
    <div class="avatar" id="avatar">
        <!-- Put the photo at assets/images/alvin.jpg. Until it exists, the initial "A" shows. -->
        <img src="../assets/images/alvin.jpg" alt="Alvin" width="112" height="112" id="avatarImg">
    </div>
    <h1>Alvin</h1>
    <p class="line" data-i18n="go.line">I help you compare new launch projects in KL &amp; Selangor.</p>

    <div class="links">
        <a class="btn primary" id="goEbook" href="../pages/ebook.html" data-go="ebook">
            <span id="goEbookText" >Free eBook (KL &amp; Selangor new launches)</span>
        </a>
        <a class="btn" id="goTools" href="../index.html" data-go="compare_tool">
            <span data-i18n="go.tool">Project comparison tool</span>
        </a>
        <a class="btn wa" id="goWa" href="https://wa.me/60175240726?text=Hi%2C%20I%27d%20like%20to%20know%20more%20about%20new%20launch%20projects." data-go="whatsapp" target="_blank" rel="noopener">
            <span data-i18n="go.wa">WhatsApp me</span>
        </a>
    </div>

    <p class="foot">&copy; 2026 MYPropertyComparison &middot; <a href="../pages/privacy-policy.html">Privacy Policy</a></p>
</main>

<script>
/* GA: one event per tap, button name only (no personal data) */
document.querySelectorAll('[data-go]').forEach(function (a) {
    a.addEventListener('click', function () {
        if (typeof gtag === 'function') gtag('event', 'go_click', { button: a.getAttribute('data-go') });
    });
});

/* No photo yet? show the initial instead of a broken image */
(function () {
    var img = document.getElementById('avatarImg');
    function noPhoto() { img.remove(); document.getElementById('avatar').textContent = 'A'; }
    img.addEventListener('error', noPhoto);
    if (img.complete && img.naturalWidth === 0) noPhoto();
})();

/* Ebook button: project count from data/projects.json (same rule as the ebook page:
   KL & Selangor only, so the non-KL/Selangor locations below are left out) */
(function () {
    var NOT_KL_SELANGOR = ['Johor Bahru', 'Kota Kinabalu'];
    var count = 0;
    function T(k, en, v) { return window.i18n ? window.i18n.t(k, en, v) : en.replace('{n}', v && v.n); }
    function render() {
        document.getElementById('goEbookText').textContent = count
            ? T('go.ebook', 'Free eBook ({n} KL & Selangor new launches)', { n: count })
            : T('go.ebook_plain', 'Free eBook (KL & Selangor new launches)');
    }
    document.addEventListener('i18nchange', render);
    document.addEventListener('DOMContentLoaded', render);
    fetch('../data/projects.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (list) {
            count = list.filter(function (p) {
                var loc = p.location || '';
                return !NOT_KL_SELANGOR.some(function (x) { return loc.indexOf(x) !== -1; });
            }).length;
            render();
        })
        .catch(function () { /* keep the label without a number */ });
    /* WhatsApp message follows the chosen language */
    document.getElementById('goWa').addEventListener('click', function () {
        this.href = 'https://wa.me/60175240726?text=' + encodeURIComponent(T('go.wa_msg', "Hi, I'd like to know more about new launch projects."));
    });
})();
</script>
<script src="../assets/wa-track.js?v=1" data-ref="MPC-209"></script>
</body>
</html>
